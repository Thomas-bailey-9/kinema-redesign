<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="t">
  <title id="t">Sample film artwork: a moonlit pine wood with a trail of warm lanterns</title>
  <!-- Original artwork created for the Kinema in the Woods redesign concept (sample film, not a real release). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f2a"/>
      <stop offset="0.55" stop-color="#173a34"/>
      <stop offset="1" stop-color="#0b1611"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.68" cy="0.2" r="0.42">
      <stop offset="0" stop-color="#f4eedf" stop-opacity="0.38"/>
      <stop offset="0.4" stop-color="#ead6a6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ead6a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset="0.35" stop-color="#f1c776" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e0a24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clearing" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f1c776" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f1c776" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0d2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cfe0d2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#cfe0d2" stop-opacity="0"/>
    </linearGradient>
    <g id="pine">
      <path d="M0 -120 L18 -80 L10 -80 L30 -40 L18 -40 L40 0 L-40 0 L-18 -40 L-30 -40 L-10 -80 L-18 -80 Z"/>
      <rect x="-4" y="0" width="8" height="18"/>
    </g>
  </defs>

  <rect width="400" height="560" fill="url(#sky)"/>
  <rect width="400" height="560" fill="url(#moonGlow)"/>

  <!-- stars -->
  <g fill="#f4eedf">
    <circle cx="40" cy="48" r="1.1" opacity="0.7"/><circle cx="96" cy="92" r="0.9" opacity="0.5"/>
    <circle cx="150" cy="36" r="1.2" opacity="0.6"/><circle cx="210" cy="70" r="0.8" opacity="0.5"/>
    <circle cx="352" cy="44" r="1" opacity="0.6"/><circle cx="318" cy="150" r="0.8" opacity="0.4"/>
    <circle cx="70" cy="160" r="0.9" opacity="0.45"/><circle cx="180" cy="128" r="0.7" opacity="0.4"/>
  </g>

  <!-- moon -->
  <circle cx="272" cy="112" r="38" fill="#f4eedf" opacity="0.95"/>
  <circle cx="286" cy="104" r="36" fill="#173a34" opacity="0.18"/>

  <!-- far ridge of pines -->
  <g fill="#1d4637" opacity="0.85">
    <use href="#pine" transform="translate(20 300) scale(0.8)"/>
    <use href="#pine" transform="translate(70 290) scale(0.95)"/>
    <use href="#pine" transform="translate(120 304) scale(0.75)"/>
    <use href="#pine" transform="translate(300 296) scale(0.9)"/>
    <use href="#pine" transform="translate(350 306) scale(0.8)"/>
    <use href="#pine" transform="translate(392 292) scale(0.95)"/>
  </g>
  <rect y="260" width="400" height="90" fill="url(#mist)"/>

  <!-- warm clearing glow -->
  <ellipse cx="206" cy="318" rx="120" ry="60" fill="url(#clearing)"/>

  <!-- middle pines -->
  <g fill="#143428">
    <use href="#pine" transform="translate(-6 380) scale(1.35)"/>
    <use href="#pine" transform="translate(58 372) scale(1.15)"/>
    <use href="#pine" transform="translate(338 376) scale(1.25)"/>
    <use href="#pine" transform="translate(404 384) scale(1.4)"/>
  </g>

  <!-- winding path -->
  <path d="M150 560 C 170 500, 250 470, 228 420 S 180 360, 206 326 L 212 326 C 196 364, 248 400, 252 430 S 230 500, 270 560 Z" fill="#0f241b"/>
  <path d="M150 560 C 170 500, 250 470, 228 420 S 180 360, 206 326" fill="none" stroke="#2a5040" stroke-width="1.2" opacity="0.6"/>

  <!-- lantern trail -->
  <g>
    <circle cx="208" cy="330" r="10" fill="url(#lantern)"/><circle cx="208" cy="330" r="1.8" fill="#fff6dd"/>
    <circle cx="196" cy="356" r="12" fill="url(#lantern)"/><circle cx="196" cy="356" r="2" fill="#fff6dd"/>
    <circle cx="214" cy="384" r="14" fill="url(#lantern)"/><circle cx="214" cy="384" r="2.2" fill="#fff6dd"/>
    <circle cx="240" cy="414" r="17" fill="url(#lantern)"/><circle cx="240" cy="414" r="2.5" fill="#fff6dd"/>
    <circle cx="232" cy="452" r="21" fill="url(#lantern)"/><circle cx="232" cy="452" r="3" fill="#fff6dd"/>
    <circle cx="204" cy="494" r="26" fill="url(#lantern)"/><circle cx="204" cy="494" r="3.6" fill="#fff6dd"/>
  </g>

  <!-- foreground pines frame -->
  <g fill="#0a1812">
    <use href="#pine" transform="translate(30 560) scale(2.3)"/>
    <use href="#pine" transform="translate(386 560) scale(2.5)"/>
  </g>

  <!-- small figure with lantern on the path -->
  <g transform="translate(222 470)">
    <circle cx="14" cy="-12" r="9" fill="url(#lantern)"/>
    <path d="M-6 0 C -6 -14, 6 -14, 6 0 L 4 22 L -4 22 Z" fill="#0a1812"/>
    <circle cx="0" cy="-18" r="5" fill="#0a1812"/>
    <path d="M4 -8 L14 -12" stroke="#0a1812" stroke-width="2"/>
  </g>

  <!-- subtle vignette -->
  <rect width="400" height="560" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="40"/>
</svg>
